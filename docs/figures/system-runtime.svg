<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 952" width="1200" height="952" role="img" aria-labelledby="title desc">
<title id="title">System runtime, low level: what runs where</title>
<desc id="desc">Five compose services: init bootstraps the database once, db is Postgres 17 with pgvector, app is the FastAPI app on port 8000, sandboxd holds the Docker socket and starts one sandbox container per job. In Postgres, four adjuster logins share chat_adjuster, the supervisor has chat_supervisor and the analyst chat_analyst. Adjusters and the supervisor read through forced row security keyed on session_user and security_invoker views. The analyst reads only agg.metric, which runs as agg_owner and withholds cells under 10 claims or where one claim is over half. Each sandbox job has no network, a read-only root, uid 65534, 512 MB, one CPU, 64 processes, 10 seconds and 1 MiB of output. Telemetry is OpenTelemetry spans, request and audit rows, and the operator dashboard.</desc>
