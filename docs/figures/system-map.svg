<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 914" width="1200" height="914" role="img" aria-labelledby="title desc">
<title id="title">System map, top level: one question end to end</title>
<desc id="desc">The browser posts a question to the FastAPI app, where the gate refuses injection and off-topic questions and the keyword router asks back, says the period is outside the data, or picks the lookup, figures, documents or why path. Every path reads Postgres as the asker&#x27;s own login, and the why path also runs a sandbox job. The verifier checks numbers and citations before the answer and its evidence stream back as server-sent events. Ingest loads documents, notes and scans into Postgres, and each request is logged for the operator dashboard.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect width="1200" height="914" fill="#ffffff"/>
