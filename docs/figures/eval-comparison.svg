<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-labelledby="title desc">
<title id="title">Dev and held-out, eval results with no API key</title>
<desc id="desc">Dev and held-out with no API key, each check a rate with its Wilson interval. Routing: dev 38 of 38 (100.0%, interval 90.8% to 100.0%), held-out 22 of 26 (84.6%, interval 66.5% to 93.8%). Refusals: dev 10 of 10 (100.0%, interval 72.2% to 100.0%), held-out 6 of 8 (75.0%, interval 40.9% to 92.8%). SQL results: dev 24 of 24 (100.0%, interval 86.2% to 100.0%), held-out 9 of 12 (75.0%, interval 46.8% to 91.1%). Cited answers: dev 17 of 17 (100.0%, interval 81.6% to 100.0%), held-out 7 of 9 (77.8%, interval 45.3% to 93.7%). Dev shaped the rules. Held-out cases were reserved.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
