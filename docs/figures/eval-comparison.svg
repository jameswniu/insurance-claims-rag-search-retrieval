<text x="48" y="100" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" fill="#435363">No API key · Points are rates, bars are Wilson intervals.</text>
