<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" width="1200" height="528" role="img" aria-labelledby="title desc">
<title id="title">Claims Q&amp;A, eval results with no API key</title>
<desc id="desc">Claims Q&amp;A answers questions about claims, policies and scanned forms for a made-up home insurer, on synthetic data. Eval results with no API key: 0 leaks found in 84 dev runs, 0 harmful SQL executions in 552, 28 of 28 planted errors caught, 0 wrong answers in 34 held-out answers. A question passes these stages in order: Gate, Route, Query or search, Verify, Stream. Queries use the asker&#x27;s Postgres login under row-level security.</desc>
